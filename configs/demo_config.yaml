# Lightweight config for CPU smoke-testing / CI / repo demo runs.
# Produces a runnable end-to-end example quickly; for the reported
# 63.8% mIoU result use configs/train_config.yaml on a GPU.
data:
  source: synthetic
  root: null
  num_samples: 400
  image_size: 64
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 42

model:
  in_channels: 6
  num_classes: 6
  base_filters: 16
  bilinear: true

train:
  epochs: 6
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: adamw
  lr_scheduler: cosine
  num_workers: 0
  amp: false
  early_stop_patience: 8

output:
  checkpoint_dir: checkpoints
  results_dir: results
  run_name: unet_demo
